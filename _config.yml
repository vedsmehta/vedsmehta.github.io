### Site Settings ###
title: "code for change. with vedant."
description: >
  i like training deep neural networks
  to solve problems. and sometimes i even
  make websites.
baseurl: ""  # Leave empty if hosted at <your-username>.github.io
repository: "vedsmehta/vedsmehta.github.io"
open_new_tab: false  # Opens external URLs in new tab for project links


### Plugins ###
plugins:
  - jemoji


### Navbar Settings ###
nav_exclude:
  - pages/404.html
  - pages/index.md


### Author Info ###
author:
  name: "Vedant Mehta"
  image: "https://i.ibb.co/93d22TXj/IMG-4352-2.jpg"
  email: "veds.mehta@gmail.com"
  github: "vedsmehta"
  linkedin: "vedsmehta"


### Collections ###
collections:
  projects:
    output: true
    permalink: /projects/:name


### Defaults for collections ###
defaults:
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "project"


### Exclude from processing ###
exclude:
  - README.md
  - LICENSE
  - "*.log"