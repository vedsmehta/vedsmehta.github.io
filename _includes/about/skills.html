<div class="skills">
  <h3>{{ include.title }}</h3>
  {% for skill in include.source %}
    <div class="skill">
      <div class="skill__label">
        <span>{{ skill.name }}</span>
        <span>{{ skill.percentage }}%</span>
      </div>
      <div class="skill__track">
        <div class="skill__fill skill__fill--{{ skill.color }}" style="width: {{ skill.percentage }}%;"></div>
      </div>
    </div>
  {% endfor %}
</div>
