<ul class="social-icons">
  {% for entry in site.data.social-media %}
    {% assign item = entry[1] %}
    <li>
      <a href="{{ item.url }}" aria-label="{{ entry[0] | capitalize }}"{% if item.url contains 'http' and site.open_new_tab %} target="_blank" rel="noopener"{% endif %}>
        {% case item.icon %}
          {% when "email" %}
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 5.5A2.5 2.5 0 0 1 4.5 3h15A2.5 2.5 0 0 1 22 5.5v13a2.5 2.5 0 0 1-2.5 2.5h-15A2.5 2.5 0 0 1 2 18.5v-13Zm2.2.3 7.8 6.1 7.8-6.1a1 1 0 0 0-.3-.05H4.5a1 1 0 0 0-.3.05ZM20 7.7l-7.4 5.8a1 1 0 0 1-1.2 0L4 7.7V18.5c0 .28.22.5.5.5h15a.5.5 0 0 0 .5-.5V7.7Z"/></svg>
          {% when "github" %}
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2C6.48 2 2 6.58 2 12.25c0 4.53 2.87 8.37 6.84 9.73.5.1.68-.22.68-.5 0-.24-.01-1.05-.01-1.9-2.78.62-3.37-1.22-3.37-1.22-.46-1.2-1.11-1.52-1.11-1.52-.9-.64.07-.63.07-.63 1 .07 1.53 1.05 1.53 1.05.9 1.58 2.34 1.12 2.91.86.09-.67.35-1.12.64-1.38-2.22-.26-4.56-1.14-4.56-5.05 0-1.11.38-2.02 1.02-2.74-.1-.26-.44-1.31.1-2.72 0 0 .83-.27 2.75 1.05a9.3 9.3 0 0 1 5 0c1.9-1.32 2.73-1.05 2.73-1.05.55 1.41.2 2.46.1 2.72.64.72 1.02 1.63 1.02 2.74 0 3.92-2.34 4.79-4.57 5.04.36.32.68.94.68 1.9 0 1.37-.01 2.47-.01 2.81 0 .28.18.61.69.5A10.26 10.26 0 0 0 22 12.25C22 6.58 17.52 2 12 2Z"/></svg>
          {% when "linkedin" %}
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.98 3.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5ZM3 9h4v12H3V9Zm7 0h3.8v1.7h.05c.53-.98 1.83-2 3.77-2 4.03 0 4.78 2.55 4.78 5.86V21h-4v-5.6c0-1.34-.03-3.07-1.98-3.07-1.98 0-2.28 1.46-2.28 2.97V21h-4V9Z"/></svg>
        {% endcase %}
      </a>
    </li>
  {% endfor %}
</ul>
