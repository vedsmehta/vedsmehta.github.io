<li class="project-list__item">
  <a class="project-list__link" href="{{ include.project.url | relative_url }}">
    <div class="project-list__name">{{ include.project.name }}</div>
    <p class="project-list__description">{{ include.project.description }}</p>
    <ul class="tag-list">
      {% for tool in include.project.tools %}
        <li class="tag">{{ tool }}</li>
      {% endfor %}
    </ul>
  </a>
</li>
